name: Build and Release Desktop Apps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Mac Executable
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --name "NeonStream" --windowed --add-data "templates:templates" --add-data "static:static" --hidden-import yt_dlp --hidden-import imageio_ffmpeg main.py
        cd dist
        zip -r NeonStream-macOS.zip NeonStream.app
        
    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --name "NeonStream" --windowed --onefile --add-data "templates;templates" --add-data "static;static" --hidden-import yt_dlp --hidden-import imageio_ffmpeg main.py
        cd dist
        Rename-Item -Path NeonStream.exe -NewName NeonStream-Windows.exe
        
    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "NeonStream Release v1.0.${{ github.run_number }}"
        files: |
          dist/NeonStream-macOS.zip
          dist/NeonStream-Windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
