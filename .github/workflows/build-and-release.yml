name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0, v1.0.1, etc.

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --name "NeonStream" --windowed --add-data "templates:templates" --add-data "static:static" --hidden-import yt_dlp --hidden-import imageio_ffmpeg main.py
      # Note: On Windows, use a semicolon `;` for add-data, on Mac use a colon `:`. PyInstaller now handles either smoothly in modern versions or we can use the spec file. We will use the spec file instead since it's already generated and cross-platform compatible.
      
    - name: Use Spec File for Build
      run: pyinstaller NeonStream.spec --clean

    - name: Zip Mac Application
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r NeonStream-macOS.zip NeonStream.app
        
    - name: Rename Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        cd dist
        Rename-Item -Path NeonStream.exe -NewName NeonStream-Windows.exe
        
    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/NeonStream-macOS.zip
          dist/NeonStream-Windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
